<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A2F">
<meta name="description" content="Baku: tu dieta, tu peso y tus menús, guardados solo en tu móvil.">
<title>Baku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/UncutSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- Fondo: manchas difuminadas con la paleta Nori y grano -->
<svg class="bg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="64"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="390" height="844" fill="#1B3A2F"/>
  <g filter="url(#soft)">
    <circle cx="40" cy="110" r="170" fill="#2F5D4A"/>
    <circle cx="350" cy="80" r="120" fill="#C8A982" opacity="0.55"/>
    <circle cx="210" cy="330" r="110" fill="#F2EADB" opacity="0.22"/>
    <circle cx="350" cy="500" r="190" fill="#3E6B57"/>
    <circle cx="30" cy="640" r="170" fill="#C8A982" opacity="0.42"/>
    <circle cx="230" cy="820" r="180" fill="#2F5D4A"/>
  </g>
  <rect width="390" height="844" filter="url(#grain)" opacity="0.18" style="mix-blend-mode: overlay"/>
</svg>

<!-- Filtro de refracción para el cristal -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="2" seed="11" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="brand" aria-hidden="true" hidden></div>
<main id="app" aria-live="polite"></main>
<nav id="nav" aria-label="Navegación principal" hidden></nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
